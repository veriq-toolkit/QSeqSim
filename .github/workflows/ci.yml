name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.lane }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: supported-range
            python-version: "3.12"
            qiskit-spec: "qiskit>=2.4,<3"
            pip-args: ""
            pytest-args: ""
          - lane: lower-bound-2.4.2
            python-version: "3.12"
            qiskit-spec: "qiskit==2.4.2"
            pip-args: "--upgrade"
            pytest-args: ""
          - lane: latest-2.x
            python-version: "3.13"
            qiskit-spec: "qiskit>=2.4,<3"
            pip-args: "--upgrade --upgrade-strategy eager"
            pytest-args: "-W error"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install QSeqSim with CUDD
        env:
          DD_FETCH: "1"
          DD_CUDD: "1"
          DD_CUDD_ZDD: "1"
        run: |
          python -m pip install --upgrade pip setuptools wheel
          ./ae/scripts/install_dd_cudd.sh
          python -m pip install -e '.[test]'
          python -m pip install ${{ matrix.pip-args }} '${{ matrix.qiskit-spec }}'
      - name: Verify backend and run tests
        run: |
          python -c "import dd.cudd, qiskit; from qseqsim import QSeqSimulator; print(f'Qiskit {qiskit.__version__} / dd.cudd {dd.cudd.__version__}'); print(QSeqSimulator)"
          python -m pip check
          python -m pytest -q ${{ matrix.pytest-args }}

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling and canonical backend
        env:
          DD_FETCH: "1"
          DD_CUDD: "1"
          DD_CUDD_ZDD: "1"
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine
          ./ae/scripts/install_dd_cudd.sh
          python -m pip install .
      - name: Build, check, and install distributions
        run: ./scripts/test_distribution.sh
