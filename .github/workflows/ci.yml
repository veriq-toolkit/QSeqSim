name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install QSeqSim with CUDD
        env:
          DD_FETCH: "1"
          DD_CUDD: "1"
          DD_CUDD_ZDD: "1"
        run: |
          python -m pip install --upgrade pip setuptools wheel
          ./ae/scripts/install_dd_cudd.sh
          python -m pip install -e '.[test]'
      - name: Verify backend and run tests
        run: |
          python -c "import dd.cudd; from qseqsim import QSeqSimulator; print(QSeqSimulator)"
          python -m pytest -q

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling and canonical backend
        env:
          DD_FETCH: "1"
          DD_CUDD: "1"
          DD_CUDD_ZDD: "1"
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine
          ./ae/scripts/install_dd_cudd.sh
          python -m pip install .
      - name: Build, check, and install distributions
        run: ./scripts/test_distribution.sh
