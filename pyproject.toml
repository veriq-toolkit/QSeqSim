[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qseqsim"
version = "0.1.1"
description = "Structure-aware symbolic simulation of dynamic and sequential Qiskit circuits"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Zihao Li", email = "lizh@ios.ac.cn" },
  { name = "Ji Guan" },
  { name = "Mingsheng Ying" },
]
maintainers = [
  { name = "Zihao Li", email = "lizh@ios.ac.cn" },
]
keywords = [
  "binary decision diagrams",
  "formal methods",
  "qiskit",
  "quantum computing",
  "symbolic simulation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "dd>=0.6,<0.7",
  "openqasm3[parser]>=1.0,<1.1",
  "qiskit>=2.4,<3",
]

[project.optional-dependencies]
test = [
  "numpy>=2.0,<3",
  "pytest>=9,<10",
]
build = [
  "build>=1.2,<2",
  "twine>=6,<8",
]
benchmark = [
  "qiskit==2.4.2",
  "qiskit-aer==0.17.2",
]

[project.urls]
Homepage = "https://www.veri-q.com/"
Documentation = "https://github.com/veriq-toolkit/QSeqSim#readme"
Issues = "https://github.com/veriq-toolkit/QSeqSim/issues"
Repository = "https://github.com/veriq-toolkit/QSeqSim.git"
Changelog = "https://github.com/veriq-toolkit/QSeqSim/blob/main/CHANGELOG.md"
Paper = "https://doi.org/10.1007/978-3-032-26204-2_30"

[tool.setuptools.packages.find]
where = ["src"]
include = ["qseqsim*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
